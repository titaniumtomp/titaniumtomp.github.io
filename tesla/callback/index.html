<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla Callback</title>
<style>body{font-family:system-ui;background:#111;color:#eee;padding:2em;max-width:700px;margin:auto}code{display:block;word-break:break-all;background:#222;padding:1em;border-radius:8px;margin:1em 0}button{padding:.6em 1.2em;font-size:1em;border-radius:6px;border:0;background:#3b82f6;color:#fff}</style></head>
<body><h2>Cabin Commander – Tesla authorization</h2><p id="msg">Authorization code:</p><code id="c"></code><button id="b">Copy code</button>
<script>const p=new URLSearchParams(location.search);const c=p.get('code');const e=p.get('error');
document.getElementById('c').textContent=c||(e?('Error: '+e+' '+(p.get('error_description')||'')):'No code found');
document.getElementById('b').onclick=()=>{navigator.clipboard.writeText(c||'');document.getElementById('b').textContent='Copied!'};</script></body></html>
