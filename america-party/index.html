<style>
:root{--ink:#f6f3ee;--muted:#b9b3aa;--bg:#10141c}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(900px 420px at 50% -8%, rgba(255,255,255,.07), transparent 60%),
    var(--bg);
  font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
}
.bar{height:4px;background:linear-gradient(90deg,#2f4578 0 33%,#f4f1ea 33% 66%,#8d3140 66% 100%)}
main{
  min-height:calc(100% - 4px);
  display:grid;
  place-items:center;
  padding:48px 24px 64px;
  text-align:center;
}
.kicker{
  margin:0 0 16px;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:12px;
  font-weight:650;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
}
h1{
  margin:0;
  font-weight:500;
  font-size:clamp(3rem,8vw,5.25rem);
  letter-spacing:-.03em;
  line-height:.95;
}
</style>
</head>
<body>
<div class="bar" aria-hidden="true"></div>
<main>
  <div>
    <p class="kicker">America Party</p>
    <h1>Stay tuned.</h1>
  </div>
</main>
</body>
